---
- name: leapp_partitions_with_noexec | Remount noexec partition with exec option
  block:
    - name: leapp_partitions_with_noexec | Get all mountpoints with noexec option
      ansible.builtin.shell: |
        set -o pipefail
        mount | grep -E '\s(/var/lib/leapp|/var/lib|/var/tmp|/var|/tmp)\s.*noexec'
      register: mountpoints
      changed_when: false
      failed_when: false

    - name: leapp_partitions_with_noexec | Reset target volumes list
      ansible.builtin.set_fact:
        leapp_target_volumes: []

    - name: leapp_partitions_with_noexec | Build storage volumes for remount
      ansible.builtin.set_fact:
        leapp_target_volumes: "{{ leapp_target_volumes + [volume_item] }}"
      vars:
        parts: "{{ item.split(' ') }}"
        volume_item:
          device: "{{ parts[0] }}"
          mount_point: "{{ parts[2] }}"
          fs_type: "{{ parts[4] }}"
          mount_options: "{{ parts[5].replace('(', '').replace(')', '').replace('noexec', 'exec') }}"
      loop: "{{ mountpoints.stdout_lines }}"
      when: mountpoints.stdout_lines | length > 0

    - name: leapp_partitions_with_noexec | Remount with exec using mount module
      ansible.posix.mount:
        path: "{{ item.mount_point }}"
        src: "{{ item.device }}"
        fstype: "{{ item.fs_type }}"
        opts: "{{ item.mount_options }}"
        state: remounted
      loop: "{{ leapp_target_volumes | d([]) }}"
      when: leapp_target_volumes | d([]) | length > 0

    - name: leapp_partitions_with_noexec | Modify /etc/fstab to replace the noexec option
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(.*\s(/var/lib/leapp|/var/lib|/var/tmp|/var|/tmp)\s+\S+\s+\S*)\bnoexec\b'
        replace: '\1exec'
...
